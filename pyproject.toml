[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Existing executor service endpoints intentionally use compact one-line guards;
# keep the repository-wide check focused on actionable correctness/style rules.
ignore = ["E501", "E701", "E702", "I001"]
