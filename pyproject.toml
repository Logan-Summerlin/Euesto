[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=60"
pythonpath = ["."]
markers = [
    "slow: tests that are unsuitable for the default fast feedback loop",
    "docker: tests that require a Docker/container runtime",
]

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Compact one-line guards are an accepted style in the executor and protocol modules.
ignore = ["E501", "E701", "E702"]
