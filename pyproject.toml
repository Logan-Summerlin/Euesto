[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=60"
pythonpath = ["."]
markers = [
    "slow: tests that are unsuitable for the default fast feedback loop",
    "docker: tests that require a Docker/container runtime",
    "posix: tests that need the executor's Linux container (/bin/bash, POSIX permission bits, POSIX ctime); skipped on Windows",
]

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# `ruff format` owns line wrapping; it cannot split long strings, so E501 stays off.
ignore = ["E501"]
