name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  GHCR_OWNER: ${{ github.repository_owner }}
  GATEWAY_IMAGE_NAME: euesto-gateway
  EXECUTOR_IMAGE_NAME: euesto-executor
  EGRESS_PROXY_IMAGE_NAME: euesto-egress-proxy
  RUNNER_IMAGE_PREFIX: euesto-runner

jobs:
  runtime-images:
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.manifest.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          fi
          echo "owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish gateway image
        id: gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gateway
          push: true
          tags: ghcr.io/${{ steps.version.outputs.owner }}/${{ env.GATEWAY_IMAGE_NAME }}:${{ steps.version.outputs.tag }}

      - name: Build and publish executor image
        id: executor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.executor
          push: true
          tags: ghcr.io/${{ steps.version.outputs.owner }}/${{ env.EXECUTOR_IMAGE_NAME }}:${{ steps.version.outputs.tag }}

      - name: Build and publish egress proxy image
        id: egress
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.egress-proxy
          push: true
          tags: ghcr.io/${{ steps.version.outputs.owner }}/${{ env.EGRESS_PROXY_IMAGE_NAME }}:${{ steps.version.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and publish runner images with SBOM and provenance
        id: runners
        shell: bash
        env:
          REGISTRY: ghcr.io/${{ steps.version.outputs.owner }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          for target in base python node polyglot; do
            image="${REGISTRY}/${RUNNER_IMAGE_PREFIX}-${target}:${TAG}"
            docker buildx build --file docker/Dockerfile.runner --target "runner-${target}" \
              --sbom=true --provenance=true --push --tag "$image" \
              --metadata-file "runner-${target}.json" .
            digest=$(jq -r '."containerimage.digest"' "runner-${target}.json")
            [[ "$digest" == sha256:* ]]
            echo "${target}=${image}@${digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Scan runner images for known vulnerabilities
        shell: bash
        env:
          RUNNERS: >-
            ${{ steps.runners.outputs.base }}
            ${{ steps.runners.outputs.python }}
            ${{ steps.runners.outputs.node }}
            ${{ steps.runners.outputs.polyglot }}
        run: |
          set -euo pipefail
          mkdir -p vulnerability-reports
          for reference in $RUNNERS; do
            docker pull "$reference"
            name=$(basename "${reference%%@*}" | tr ':' '-')
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.67.2 image --quiet --severity HIGH,CRITICAL --format table \
              "$reference" > "vulnerability-reports/${name}.txt"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: runner-vulnerability-reports
          path: vulnerability-reports

      - name: Verify digest-pinned runtime image pulls
        shell: bash
        env:
          GATEWAY_IMAGE: ghcr.io/${{ steps.version.outputs.owner }}/${{ env.GATEWAY_IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
          EXECUTOR_IMAGE: ghcr.io/${{ steps.version.outputs.owner }}/${{ env.EXECUTOR_IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          EXECUTOR_DIGEST: ${{ steps.executor.outputs.digest }}
          EGRESS_IMAGE: ghcr.io/${{ steps.version.outputs.owner }}/${{ env.EGRESS_PROXY_IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          EGRESS_DIGEST: ${{ steps.egress.outputs.digest }}
        run: |
          docker pull "${GATEWAY_IMAGE}@${GATEWAY_DIGEST}"
          docker pull "${EXECUTOR_IMAGE}@${EXECUTOR_DIGEST}"
          docker pull "${EGRESS_IMAGE}@${EGRESS_DIGEST}"
          for reference in ${{ steps.runners.outputs.base }} ${{ steps.runners.outputs.python }} \
            ${{ steps.runners.outputs.node }} ${{ steps.runners.outputs.polyglot }}; do
            docker pull "$reference"
          done

      - name: Verify anonymous runtime image pulls for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GATEWAY_IMAGE: ghcr.io/${{ steps.version.outputs.owner }}/${{ env.GATEWAY_IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
          EXECUTOR_IMAGE: ghcr.io/${{ steps.version.outputs.owner }}/${{ env.EXECUTOR_IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          EXECUTOR_DIGEST: ${{ steps.executor.outputs.digest }}
          EGRESS_IMAGE: ghcr.io/${{ steps.version.outputs.owner }}/${{ env.EGRESS_PROXY_IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          EGRESS_DIGEST: ${{ steps.egress.outputs.digest }}
        run: |
          docker logout ghcr.io || true
          docker pull "${GATEWAY_IMAGE}@${GATEWAY_DIGEST}"
          docker pull "${EXECUTOR_IMAGE}@${EXECUTOR_DIGEST}"
          docker pull "${EGRESS_IMAGE}@${EGRESS_DIGEST}"
          for reference in ${{ steps.runners.outputs.base }} ${{ steps.runners.outputs.python }} \
            ${{ steps.runners.outputs.node }} ${{ steps.runners.outputs.polyglot }}; do
            docker pull "$reference"
          done

      - name: Write digest-pinned release manifest
        id: manifest
        shell: bash
        env:
          GATEWAY_IMAGE: ghcr.io/${{ steps.version.outputs.owner }}/${{ env.GATEWAY_IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
          EXECUTOR_IMAGE: ghcr.io/${{ steps.version.outputs.owner }}/${{ env.EXECUTOR_IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          EXECUTOR_DIGEST: ${{ steps.executor.outputs.digest }}
          EGRESS_IMAGE: ghcr.io/${{ steps.version.outputs.owner }}/${{ env.EGRESS_PROXY_IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          EGRESS_DIGEST: ${{ steps.egress.outputs.digest }}
        run: |
          [[ "${EGRESS_DIGEST}" == sha256:* ]]
          jq -n \
            --arg gateway "${GATEWAY_IMAGE}@${GATEWAY_DIGEST}" \
            --arg executor "${EXECUTOR_IMAGE}@${EXECUTOR_DIGEST}" \
            --arg egress "${EGRESS_IMAGE}@${EGRESS_DIGEST}" \
            --arg base "${{ steps.runners.outputs.base }}" \
            --arg python "${{ steps.runners.outputs.python }}" \
            --arg node "${{ steps.runners.outputs.node }}" \
            --arg polyglot "${{ steps.runners.outputs.polyglot }}" \
            '{schema_version: 3, gateway: $gateway, executor: $executor,
              egress_proxy: $egress,
              runners: {base: $base, python: $python, node: $node, polyglot: $polyglot}}' \
            > docker/release-images.json
          echo "path=docker/release-images.json" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-image-manifest
          path: docker/release-images.json

  build-windows:
    needs: runtime-images
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bootstrap locked validation environment
        run: python scripts/bootstrap.py
      - name: Validate non-container application
        shell: bash
        run: |
          python scripts/validate.py fast
          python scripts/validate.py slow --allow-unavailable
          python scripts/validate.py ruff
          python scripts/validate.py compile
          python scripts/validate.py qml
          python scripts/qml_smoke.py
      - name: Preflight validation report
        run: python scripts/validate.py preflight --json release-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation-preflight
          path: release-preflight.json
      - name: Add release image manifest to package
        uses: actions/download-artifact@v4
        with:
          name: runtime-image-manifest
          path: docker
      - name: Build application
        run: pyinstaller --noconfirm --clean build/chatbot.spec
      - name: Smoke-test packaged QML application
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $process = Start-Process dist/LocalOpenRouterChat/LocalOpenRouterChat.exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Packaged QML application exited during launch" }
          Stop-Process -Id $process.Id -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\LocalOpenRouterChat.iss'
      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path dist/LocalOpenRouterChat/* -DestinationPath LocalOpenRouterChat-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LocalOpenRouterChat-Windows-x64
          path: |
            LocalOpenRouterChat-Windows-x64.zip
            dist/installer/LocalOpenRouterChat-Windows-x64-Setup.exe
      - name: Attach tagged build to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LocalOpenRouterChat-Windows-x64.zip
            dist/installer/LocalOpenRouterChat-Windows-x64-Setup.exe
          generate_release_notes: true
