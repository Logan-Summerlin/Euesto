# Shared local/CI validation plus real Linux container security checks.
#
# One job per tier group so a hang in one tier cannot cancel the others, and every tier is one
# step with its own ceiling. The deadline ladder is pytest --timeout (180 s) < the harness
# deadline (scripts/validate.py) < the step ceiling < the job ceiling; docs/TESTING.md owns the
# table and tests/structural/test_workflow_budgets.py enforces it.
name: Validate local gateway

on:
  pull_request:
  push:
    # The repository records no default-branch name, and a push filter that misses it disables
    # this workflow after every merge with no error anywhere, so both conventional names are
    # listed. A branch that matches neither is still validated through its pull request.
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Bootstrap locked validation environment
        run: python scripts/bootstrap.py
      - name: Preflight
        shell: bash
        timeout-minutes: 2
        run: bash scripts/validation-step.sh preflight python scripts/validate.py preflight --require fast,ruff,compile --json validation-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-preflight
          path: validation-preflight.json
          if-no-files-found: ignore
      - name: Collect tests without running them
        shell: bash
        timeout-minutes: 5
        run: bash scripts/validation-step.sh collect python scripts/validate.py collect
      - name: Fast tests
        shell: bash
        timeout-minutes: 20
        run: bash scripts/validation-step.sh fast python scripts/validate.py fast
      - name: Ruff
        shell: bash
        timeout-minutes: 10
        run: bash scripts/validation-step.sh ruff python scripts/validate.py ruff
      - name: Compile
        shell: bash
        timeout-minutes: 10
        run: bash scripts/validation-step.sh compile python scripts/validate.py compile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs-fast
          path: validation-logs
          if-no-files-found: ignore

  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Bootstrap locked validation environment
        run: python scripts/bootstrap.py
      - name: Preflight
        shell: bash
        timeout-minutes: 2
        run: bash scripts/validation-step.sh preflight python scripts/validate.py preflight --require slow --json slow-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slow-preflight
          path: slow-preflight.json
          if-no-files-found: ignore
      - name: Collect tests without running them
        shell: bash
        timeout-minutes: 5
        run: bash scripts/validation-step.sh collect python scripts/validate.py collect
      - name: Slow tests
        shell: bash
        timeout-minutes: 25
        run: bash scripts/validation-step.sh slow python scripts/validate.py slow --allow-unavailable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs-slow
          path: validation-logs
          if-no-files-found: ignore

  qml:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Bootstrap locked validation environment
        run: python scripts/bootstrap.py
      - name: Preflight
        shell: bash
        timeout-minutes: 2
        run: bash scripts/validation-step.sh preflight python scripts/validate.py preflight --require qml,qml-smoke --json qml-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qml-preflight
          path: qml-preflight.json
          if-no-files-found: ignore
      - name: QML lint
        shell: bash
        timeout-minutes: 10
        run: bash scripts/validation-step.sh qml python scripts/validate.py qml
      - name: QML smoke
        shell: bash
        timeout-minutes: 10
        run: bash scripts/validation-step.sh qml-smoke python scripts/validate.py qml-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs-qml
          path: validation-logs
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-latest
    # Builds every runner image target (tests/docker/test_runner_split.py).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap locked validation environment
        run: python scripts/bootstrap.py
      - name: Preflight
        shell: bash
        timeout-minutes: 2
        run: bash scripts/validation-step.sh preflight python scripts/validate.py preflight --require docker --json docker-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-preflight
          path: docker-preflight.json
          if-no-files-found: ignore
      - name: Collect tests without running them
        shell: bash
        timeout-minutes: 5
        run: bash scripts/validation-step.sh collect python scripts/validate.py collect
      - name: Create disposable fixtures
        shell: bash
        run: |
          source scripts/docker-fixtures.sh
          setup_fixtures
          echo "LOCAL_CHAT_CI_ROOT=$LOCAL_CHAT_CI_ROOT" >> "$GITHUB_ENV"
          echo "LOCAL_CHAT_SECRETS_DIR=$LOCAL_CHAT_SECRETS_DIR" >> "$GITHUB_ENV"
          echo "LOCAL_CHAT_WORKSPACE=$LOCAL_CHAT_WORKSPACE" >> "$GITHUB_ENV"
          echo "LOCAL_CHAT_WORKSPACE_ID=ci-workspace" >> "$GITHUB_ENV"
      # A buildx builder with cache export, so the four runner targets share their base layers
      # instead of rebuilding them (tests/docker/test_runner_split.py).
      - uses: docker/setup-buildx-action@v3
      # The hosted image ships several GB of toolchains this job never uses, and the tier builds
      # four runner images plus the gateway, executor, and proxy. A build that runs out of room
      # fails with "no space left on device", and the executor refuses to start when the free
      # space is below its work capacity, so make room before the tier starts.
      - name: Free disk space for the image builds
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - name: Run container security tier
        shell: bash
        timeout-minutes: 60
        env:
          EUSTO_BUILDX_CACHE_DIR: /tmp/euesto-buildx-cache
        run: |
          trap 'docker compose --file docker/compose.yaml --file docker/compose.egress.yaml --profile agent down --volumes --remove-orphans || true' EXIT
          export LOCAL_CHAT_WORKSPACE_KEY=c1c1c1c1c1c1
          bash scripts/validation-step.sh docker python scripts/validate.py docker
      - name: Render compose configuration
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compose"
          docker compose --file docker/compose.yaml --profile agent config > "$RUNNER_TEMP/compose/compose.yaml"
          docker compose --file docker/compose.yaml --profile agent config --format json > "$RUNNER_TEMP/compose/compose.json"
      # The rendered configuration is evidence for a reviewer; the hardening invariants
      # themselves are asserted in tests/docker/test_runner_split.py, not in YAML.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-compose-report
          path: ${{ runner.temp }}/compose
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs-docker
          path: validation-logs
          if-no-files-found: ignore
      - name: Cleanup disposable fixtures
        if: always()
        shell: bash
        run: |
          source scripts/docker-fixtures.sh
          cleanup_docker_fixtures
