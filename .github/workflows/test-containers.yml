# Shared local/CI validation plus real Linux container security checks.
name: Validate local gateway

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Bootstrap locked validation environment
        run: python scripts/bootstrap.py
      - name: Preflight
        run: python scripts/validate.py preflight --json validation-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-preflight
          path: validation-preflight.json
      - name: Fast tests
        run: python scripts/validate.py fast
      - name: Slow tests
        run: python scripts/validate.py slow --allow-unavailable
      - name: Ruff
        run: python scripts/validate.py ruff
      - name: Compile
        run: python scripts/validate.py compile
      - name: QML lint and compile
        run: |
          python scripts/validate.py qml
          python -m compileall -q app.py src server shared executor tests scripts
          python scripts/qml_smoke.py

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Bootstrap locked validation environment
        run: python scripts/bootstrap.py
      - name: Preflight Docker
        run: python scripts/validate.py preflight --json docker-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-preflight
          path: docker-preflight.json
      - name: Create disposable fixtures
        shell: bash
        run: |
          source scripts/docker-fixtures.sh
          setup_fixtures
          echo "LOCAL_CHAT_CI_ROOT=$LOCAL_CHAT_CI_ROOT" >> "$GITHUB_ENV"
          echo "LOCAL_CHAT_SECRETS_DIR=$LOCAL_CHAT_SECRETS_DIR" >> "$GITHUB_ENV"
          echo "LOCAL_CHAT_WORKSPACE=$LOCAL_CHAT_WORKSPACE" >> "$GITHUB_ENV"
          echo "LOCAL_CHAT_WORKSPACE_ID=ci-workspace" >> "$GITHUB_ENV"
      - name: Run container security tier
        shell: bash
        run: |
          trap 'docker compose --file docker/compose.yaml --profile agent down --volumes --remove-orphans || true' EXIT
          python scripts/validate.py docker
      - name: Compose policy rendering
        shell: bash
        run: |
          set -euo pipefail
          : "${LOCAL_CHAT_SECRETS_DIR:?LOCAL_CHAT_SECRETS_DIR was not preserved from fixture setup}"
          : "${LOCAL_CHAT_WORKSPACE:?LOCAL_CHAT_WORKSPACE was not preserved from fixture setup}"
          docker compose --file docker/compose.yaml config > compose.yaml
          grep -Eq 'network_mode:[[:space:]]*"?none"?[[:space:]]*$' compose.yaml
          grep -Eq 'read_only:[[:space:]]*"?true"?[[:space:]]*$' compose.yaml
          grep -Eq '^[[:space:]]*-[[:space:]]*no-new-privileges:true[[:space:]]*$' compose.yaml
          ! grep -Fq '/var/run/docker.sock' compose.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-compose-report
          path: compose.yaml
      - name: Cleanup disposable fixtures
        if: always()
        shell: bash
        run: |
          source scripts/docker-fixtures.sh
          cleanup_docker_fixtures
